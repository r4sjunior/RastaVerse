<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RastaME Viewer</title>
<link rel="stylesheet" href="./css/app.css">
<style>
  body { overflow: hidden; }
  #panel { position: fixed; left: 12px; top: 12px; width: min(300px, calc(100% - 24px)); background: rgba(20, 22, 26, .88); border: 1px solid var(--line); border-radius: 12px; padding: 12px; backdrop-filter: blur(6px); z-index: 3; }
  #panel h1 { font-size: 16px; margin: 0 0 8px; } #panel h1 span { color: var(--accent); }
  #stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; margin-bottom: 10px; }
  #stats dt { color: var(--muted); } #stats dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button, .row a { font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-decoration: none; }
  .row button.on { background: var(--accent); color: #111; border-color: transparent; }
  .row button.rec { background: var(--bad); border-color: transparent; color: #fff; }
  #legend { margin-top: 8px; font-size: 12px; color: var(--muted); }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head>
<body>
<div id="panel">
  <h1>RastaME <span>SLAM viewer</span></h1>
  <dl id="stats"></dl>
  <div class="row">
    <button id="b-follow" class="on">Seguir câmera</button>
    <button id="b-mode">Cubos</button>
    <button id="b-rec">Gravar sessão</button>
    <button id="b-clear">Limpar</button>
    <a id="b-ply" href="/api/map.ply" download>Baixar .ply</a>
  </div>
  <p id="legend">Cor = altura. Linha branca = trajetória do celular (SLAM). Amarelo = câmera agora.</p>
</div>
<script type="module" src="./js/viewer.js"></script>
</body>
</html>
