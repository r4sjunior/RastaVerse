<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RastaME Avatar</title>
<style>
  :root { --bg: #14161a; --fg: #e9e6dc; --muted: #8b8d93; --accent: #d9e27a; --panel: rgba(20,22,26,.85); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; left: 12px; top: 12px; background: var(--panel); padding: 10px 12px; border-radius: 10px; max-height: calc(100% - 48px); overflow: auto; }
  #ui h1 { font-size: 14px; margin: 0 0 6px; color: var(--accent); }
  #ui button { display: block; width: 100%; text-align: left; margin: 2px 0; background: transparent; color: var(--fg); border: 0; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  #ui button.on { background: var(--accent); color: #111; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
</head>
<body>
<div id="ui"><h1>Animações</h1><div id="list"></div></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { loadAvatar } from './js/avatar.js';

const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d2026);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 50);
const yaw = Number(q.get('yaw') || 25) * Math.PI / 180;
cam.position.set(Math.sin(yaw) * 4.2, 1.3, Math.cos(yaw) * 4.2);
const controls = new OrbitControls(cam, renderer.domElement);
controls.target.set(0, 0.85, 0); controls.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 3); sun.castShadow = true; scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(2, 48), new THREE.MeshStandardMaterial({ color: 0x2b2f37 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
scene.add(new THREE.AxesHelper(0.5));

const avatar = await loadAvatar('./assets/avatar.json', { height: 1.75 });
scene.add(avatar.root);
const list = document.getElementById('list');
const names = Object.keys(avatar.data.anims);
function select(n) {
  avatar.play(n, { restart: true });
  [...list.children].forEach((b) => b.classList.toggle('on', b.textContent === n));
}
for (const n of names) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => select(n); list.appendChild(b); }
select(q.get('anim') || 'idle');
if (q.has('t')) { avatar.update(Number(q.get('t'))); }
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  if (!q.has('t')) avatar.update(clock.getDelta());
  renderer.render(scene, cam);
});
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
window.__ready = true;
</script>
</body>
</html>
